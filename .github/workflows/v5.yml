name: ZBET90 Engine v9.0

on:
  #schedule:
   # - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'engine_only | settler_only | both'
        required: false
        default: 'both'

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: ⚙️ Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Engine
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.run_mode == 'both' ||
          github.event.inputs.run_mode == 'engine_only'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY2: ${{ secrets.ODDS_API_KEY2 }}
          ODDS_API_KEY3: ${{ secrets.ODDS_API_KEY3 }}
          GEMINI: ${{ secrets.GEMINI }}
          GEMINI1: ${{ secrets.GEMINI1 }}
          GEMINI2: ${{ secrets.GEMINI2 }}
          GEMINI3: ${{ secrets.GEMINI3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL: ${{ secrets.API_FOOTBALL }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          TSDB_API_KEY: ${{ secrets.TSDB_API_KEY }}
        run: python main4.py

      - name: ⏳ Run Settler
        if: >
          github.event_name == 'schedule' ||
          github.event.inputs.run_mode == 'both' ||
          github.event.inputs.run_mode == 'settler_only'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY2: ${{ secrets.ODDS_API_KEY2 }}
          ODDS_API_KEY3: ${{ secrets.ODDS_API_KEY3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python settler.py

      - name: 💾 Commit Cache
        if: always()
        run: |
          git config --local user.email "zbet90-bot@github.com"
          git config --local user.name "ZBET90 Bot"
          git add api_cache/ || true
          git diff --staged --quiet || git commit -m "bot: update cache [skip ci]"
          git push || true

      - name: 📄 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zbet90-logs-${{ github.run_number }}
          path: api_cache/*.log
          retention-days: 7
